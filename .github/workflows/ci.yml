name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv (avec cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchroniser l'environnement (deps + dev)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check code/ tests/ scripts_independants/

      - name: Tests (pytest, hors réseau)
        run: uv run pytest -q -m "not network"
