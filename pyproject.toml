[project]
name = "sdm-engoulevent"
version = "0.1.0"
description = "SDM Engoulevent bois-pourri — GMQ-580 projet de session"
requires-python = ">=3.11"

dependencies = [
    "polars>=0.20",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "astral>=3.2",
    "matplotlib>=3.8",
    "contextily>=1.5",
    "tqdm>=4.66",
    "joblib>=1.3",
    "pyarrow>=15",       # backend Polars parquet
    "pandas>=2.0",       # interface sklearn uniquement
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
