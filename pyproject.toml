[project]
name = "sdm-engoulevent"
version = "0.1.0"
description = "SDM Engoulevent bois-pourri — GMQ-580 projet de session"
requires-python = ">=3.11"

dependencies = [
    "polars>=0.20",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "astral>=3.2",
    "matplotlib>=3.8",
    "contextily>=1.5",
    "tqdm>=4.66",
    "joblib>=1.3",
    "pyarrow>=15",       # backend Polars parquet
    "pandas>=2.0",       # interface sklearn uniquement
    "pystac-client>=0.8",    # requête du catalogue STAC (Landsat C2 L2)
    "planetary-computer>=1.0",  # signature des URLs Planetary Computer
    "odc-stac>=0.3",     # chargement des scènes STAC en xarray
    "xarray>=2024.1",    # cube spatio-temporel du composite LST
    "dask[distributed]>=2024.1",  # calcul chunké + LocalCluster multi-cœurs (dashboard)
    "pyyaml>=6.0",       # lecture de config.yaml
    "pydantic>=2.6",     # validation typée de la config
    "whitebox>=2.3.6",
    "shap>=0.46",        # valeurs de Shapley (TreeExplainer) — interprétation du RF (J5/J7)
    "numba>=0.60",       # dépendance de shap ; plancher requis pour Python 3.13 + numpy 2.x
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "ruff>=0.3",
    "pytest>=8.0",
]

# Projet « application » (scripts dans code/), pas une librairie importable :
# uv installe uniquement les dépendances, sans construire de wheel du projet.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test nécessitant un accès réseau (exclu de la CI : -m 'not network')",
]
